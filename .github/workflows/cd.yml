name: CD - Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm deployment'
        required: true
        default: ""

permissions:
  id-token: write   # required for Azure OIDC login
  contents: read

env:
  TF_WORKING_DIR: terraform/hub
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  apply:
    name: Apply
    # Enterprise policy disables GitHub-hosted runners -> use self-hosted.
    runs-on: [self-hosted]
    # Requires a GitHub Environment named "production" with required reviewers
    # configured for a manual approval gate before apply.
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Guard - workflow_dispatch confirmation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'apply'
        run: |
          echo "Confirmation input was not 'apply'. Aborting."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.10.0"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}"
          -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}"
          -backend-config="key=hub/connectivity.tfstate"

      - name: Terraform Apply
        run: >-
          terraform apply -input=false -auto-approve
          -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
