###############################################################################
# CD: main マージ時の反映
#
# 方針:
#   - main ブランチを正本とし、マージを契機に反映する
#   - dev → stg → prod の順に段階適用する（前段が成功しないと次へ進まない）
#   - 同一環境内は deployments.yml の order 順に 1 スタックずつ適用する
#   - prod の Environment には required reviewers を設定し、手動承認を必須とする
#   - 承認画面で plan 結果を確認してから apply する
#
# `environment:` は job 単位でしか指定できない。
# したがって 1 デプロイ = 1 job とし、まとめて 1 job で回してはならない。
# まとめると環境ごとの承認ゲートが機能しなくなる。
#
# Runner はリポジトリ変数 RUNNER_LABEL で切り替える。
# リモート state (azurerm backend) に到達するには private 化が前提。
###############################################################################
name: cd

on:
  push:
    branches:
      - main
    paths:
      - "stacks/**"
      - "deployments.yml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 同一環境への同時 apply を防ぐ。
# state のロック競合や、意図しない順序での反映を避けるため。
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.build.outputs.dev }}
      stg: ${{ steps.build.outputs.stg }}
      prod: ${{ steps.build.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          # order の昇順に並べる。スタック間の依存（20-connectivity の
          # 診断設定が 40-management の LAW を参照する等）があるため、
          # 適用順序は deployments.yml の order を正本とする。
          for e in dev stg prod; do
            m=$(yq -o=json -I=0 \
              "[.deployments[] | select(.env == \"$e\")] | sort_by(.order)" \
              deployments.yml)
            echo "$e=$m" >> "$GITHUB_OUTPUT"
            echo "$e -> $m"
          done

  apply-dev:
    needs: discover
    name: apply dev/${{ matrix.stack }}
    uses: ./.github/workflows/_terraform-apply.yml
    strategy:
      fail-fast: true
      # スタック間に依存があるため、order 順に 1 つずつ適用する。
      # 並列実行すると 40-management の LAW が未作成のまま
      # 20-connectivity が診断設定を作ろうとして失敗する。
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.dev) }}
    with:
      stack: ${{ matrix.stack }}
      env_name: ${{ matrix.env }}
      environment: ${{ matrix.environment }}
      subscription_id: ${{ matrix.subscription_id }}

  apply-stg:
    needs: [discover, apply-dev]
    name: apply stg/${{ matrix.stack }}
    uses: ./.github/workflows/_terraform-apply.yml
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.stg) }}
    with:
      stack: ${{ matrix.stack }}
      env_name: ${{ matrix.env }}
      environment: ${{ matrix.environment }}
      subscription_id: ${{ matrix.subscription_id }}

  # prod の Environment 側に required reviewers を設定しておくこと。
  # ここに到達した時点で job が待機状態になり、承認されるまで apply されない。
  apply-prod:
    needs: [discover, apply-stg]
    name: apply prod/${{ matrix.stack }}
    uses: ./.github/workflows/_terraform-apply.yml
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.prod) }}
    with:
      stack: ${{ matrix.stack }}
      env_name: ${{ matrix.env }}
      environment: ${{ matrix.environment }}
      subscription_id: ${{ matrix.subscription_id }}
