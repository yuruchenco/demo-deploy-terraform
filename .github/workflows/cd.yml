###############################################################################
# CD: main マージ時の反映
#
# 方針:
#   - main ブランチを正本とし、マージを契機に反映する
#   - dev → stg → prd の順に段階適用する（前段が成功しないと次へ進まない）
#   - 同一環境内は deployments.yml の order 順に 1 スタックずつ適用する
#   - prd の Environment には required reviewers を設定し、手動承認を必須とする
#   - 承認画面で plan 結果を確認してから apply する
#
# `environment:` は job 単位でしか指定できない。
# したがって 1 デプロイ = 1 job とし、まとめて 1 job で回してはならない。
# まとめると環境ごとの承認ゲートが機能しなくなる。
#
# Runner はリポジトリ変数 RUNNER_LABEL で切り替える。
# リモート state (azurerm backend) に到達するには private 化が前提。
###############################################################################
name: cd

on:
  push:
    branches:
      - main
    paths:
      - "stacks/**"
      - "modules/**"
      - "deployments.yml"
      - ".github/workflows/cd.yml"
      - ".github/workflows/_terraform-apply.yml"
      - ".github/actions/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

# 同一環境への同時 apply を防ぐ。
# state のロック競合や、意図しない順序での反映を避けるため。
#
# 注意: cancel-in-progress=false でも、同一 group で「待機中」にできる run は 1 つだけ。
# 承認待ちの間に 2 件以上マージされると、古い待機中 run は自動キャンセルされる。
# そのため discover の差分範囲は push の before ではなく
# 「直前に成功した CD run の commit」を起点とし、キャンセルされた run の変更も拾う。
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.build.outputs.dev }}
      stg: ${{ steps.build.outputs.stg }}
      prd: ${{ steps.build.outputs.prd }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 変更のあった スタック × 環境 だけを対象にする（変更の局所性）。
          # 手動実行(workflow_dispatch)は全件。
          # 差分の起点は直前に成功した CD run の commit（無ければ全件）。
          # order の昇順に並べる。スタック間の依存（20-connectivity の
          # 診断設定が 40-management の LAW を参照する等）があるため、
          # 適用順序は deployments.yml の order を正本とする。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sel=$(bash .github/scripts/select-deployments.sh "" all)
          else
            base=$(gh run list --workflow cd.yml --branch main --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            echo "差分の起点: ${base:-なし（全件）}"
            if [ -n "$base" ]; then
              sel=$(bash .github/scripts/select-deployments.sh "${base}..${{ github.sha }}")
            else
              sel=$(bash .github/scripts/select-deployments.sh "" all)
            fi
          fi
          for e in dev stg prd; do
            m=$(jq -c --arg e "$e" '[.[] | select(.env == $e)]' <<<"$sel")
            echo "$e=$m" >> "$GITHUB_OUTPUT"
            echo "$e -> $m"
          done

  apply-dev:
    needs: discover
    if: needs.discover.outputs.dev != '[]'
    name: apply dev/${{ matrix.slug }}
    uses: ./.github/workflows/_terraform-apply.yml
    strategy:
      fail-fast: true
      # スタック間に依存があるため、order 順に 1 つずつ適用する。
      # 並列実行すると 40-management の LAW が未作成のまま
      # 20-connectivity が診断設定を作ろうとして失敗する。
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.dev) }}
    with:
      stack: ${{ matrix.stack }}
      env_name: ${{ matrix.env }}
      environment: ${{ matrix.environment }}
      config_dir: ${{ matrix.dir }}
      slug: ${{ matrix.slug }}
      instance: ${{ matrix.instance }}

  apply-stg:
    needs: [discover, apply-dev]
    # deployments.yml に該当環境の定義が無い場合は空のマトリクスになる。
    # 空の include を渡すとジョブがエラーになるため、ここでスキップする。
    # dev がスキップされた場合も stg を実行できるよう always() を使う。
    if: always() && needs.apply-dev.result != 'failure' && needs.discover.outputs.stg != '[]'
    name: apply stg/${{ matrix.slug }}
    uses: ./.github/workflows/_terraform-apply.yml
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.stg) }}
    with:
      stack: ${{ matrix.stack }}
      env_name: ${{ matrix.env }}
      environment: ${{ matrix.environment }}
      config_dir: ${{ matrix.dir }}
      slug: ${{ matrix.slug }}
      instance: ${{ matrix.instance }}

  # prd の Environment 側に required reviewers を設定しておくこと。
  # ここに到達した時点で job が待機状態になり、承認されるまで apply されない。
  apply-prd:
    needs: [discover, apply-dev, apply-stg]
    # stg がスキップされた場合も prd を実行できるよう always() を使う。
    # ただし前段が失敗した場合は進めない。
    # dev / stg に変更が無くスキップされた場合も prd を実行できるようにする。
    if: always() && (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped') && needs.apply-stg.result != 'failure' && needs.discover.outputs.prd != '[]'
    name: apply prd/${{ matrix.slug }}
    uses: ./.github/workflows/_terraform-apply.yml
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.prd) }}
    with:
      stack: ${{ matrix.stack }}
      env_name: ${{ matrix.env }}
      environment: ${{ matrix.environment }}
      config_dir: ${{ matrix.dir }}
      slug: ${{ matrix.slug }}
      instance: ${{ matrix.instance }}
