###############################################################################
# 再利用可能ワークフロー: 1 つの スタック × 環境 に対する apply
#
# cd.yml から環境ごとに呼び出される。
# 同じ手順を環境ごとに書き写さないことで、
# 「本番だけ手順が違う」状態が生まれるのを防ぐ。
#
# 重要:
#   plan と apply を同一 job 内で実行し、plan ファイル (tfplan) を
#   そのまま apply する。別 job に分けて plan を受け渡すと、
#   その間に state が変化して plan が陳腐化する余地が生まれる。
###############################################################################
name: _terraform-apply

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      env_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      subscription_id:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: stacks/${{ inputs.stack }}

    env:
      # OIDC のみ。クライアントシークレットは存在しない。
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false

      # -reconfigure は必須。付け忘れると別環境の state を
      # コピーしてしまう事故につながる。
      - name: terraform init
        run: |
          terraform init -reconfigure -input=false \
            -backend-config=envs/${{ inputs.env_name }}/backend.hcl

      - name: terraform plan
        run: |
          terraform plan -input=false \
            -var-file=envs/${{ inputs.env_name }}/terraform.tfvars \
            -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
