###############################################################################
# OIDC / GitHub-hosted runner 讀懆ｨｼ繝ｯ繝ｼ繧ｯ繝輔Ο繝ｼ
#
# 讀懆ｨｼ逶ｮ逧・
#   1. OIDC (Workload Identity Federation) 縺ｫ繧医ｊ縲・
#      GitHub 蛛ｴ縺ｫ繧ｷ繝ｼ繧ｯ繝ｬ繝・ヨ繧剃ｸ蛻・ｿ晏ｭ倥○縺壹↓ Azure 縺ｸ隱崎ｨｼ縺ｧ縺阪ｋ縺薙→
#   2. GitHub-hosted runner (ubuntu-latest) 縺九ｉ縲・
#      讀懆ｨｼ(stg) 縺ｨ 譛ｬ逡ｪ(prod) 縺ｮ荳｡迺ｰ蠅・↓蟇ｾ縺励※螳溯｡後〒縺阪ｋ縺薙→
#
# 驥崎ｦ√↑險ｭ險医・繧､繝ｳ繝・
#   - 隱崎ｨｼ諠・ｱ縺ｯ Environment *variables* 縺ｮ縺ｿ・・ecrets 縺ｯ譛ｪ菴ｿ逕ｨ・峨・
#     client ID / tenant ID / subscription ID 縺ｯ縺・★繧後ｂ讖溷ｯ・〒縺ｯ縺ｪ縺・・
#     繝代せ繝ｯ繝ｼ繝峨ｄ險ｼ譏取嶌縺ｫ逶ｸ蠖薙☆繧九ｂ縺ｮ縺ｯ蟄伜惠縺励↑縺・・
#   - `environment:` 縺ｯ job 蜊倅ｽ阪〒縺励°謖・ｮ壹〒縺阪↑縺・◆繧√・
#     1 迺ｰ蠅・= 1 job 縺ｨ縺吶ｋ縲ゅ％繧後↓繧医ｊ迺ｰ蠅・＃縺ｨ縺ｮ謇ｿ隱阪ご繝ｼ繝医′讖溯・縺吶ｋ縲・
#   - OIDC 縺ｮ subject 縺ｯ
#       repo:<OWNER>/<REPO>:environment:<ENVIRONMENT NAME>
#     縺ｨ縺ｪ繧九・ntra 蛛ｴ縺ｮ繝輔ぉ繝・Ξ繝ｼ繧ｷ繝ｧ繝ｳ雉・ｼ諠・ｱ繧偵％縺ｮ subject 縺ｧ
#     逋ｻ骭ｲ縺吶ｋ縺薙→縺ｧ縲√後◎縺ｮ Environment 繧堤ｵ檎罰縺励◆螳溯｡後□縺代′
#     縺昴・繧ｵ繝悶せ繧ｯ繝ｪ繝励す繝ｧ繝ｳ縺ｫ隗ｦ繧後ｋ縲阪％縺ｨ繧・Entra 蛛ｴ縺ｧ蠑ｷ蛻ｶ縺ｧ縺阪ｋ縲・
#
# 譌｢遏･縺ｮ蛻ｶ邏・
#   譛ｬ繝・リ繝ｳ繝医〒縺ｯ繝昴Μ繧ｷ繝ｼ縺ｫ繧医ｊ繧ｹ繝医Ξ繝ｼ繧ｸ繧｢繧ｫ繧ｦ繝ｳ繝医・
#   publicNetworkAccess 縺悟ｼｷ蛻ｶ逧・↓ Disabled 縺ｫ縺輔ｌ繧九◆繧√・
#   azurerm backend (繝ｪ繝｢繝ｼ繝・state) 縺ｸ縺ｯ GitHub-hosted runner 縺九ｉ
#   蛻ｰ驕斐〒縺阪↑縺・ゅ◎縺ｮ縺溘ａ譛ｬ繝ｯ繝ｼ繧ｯ繝輔Ο繝ｼ縺ｧ縺ｯ backend 繧剃ｽｿ繧上★縲・
#   繧ｸ繝ｧ繝門・縺ｧ螳檎ｵ舌☆繧九Ο繝ｼ繧ｫ繝ｫ state 縺ｧ讀懆ｨｼ縺吶ｋ縲・
#   繝ｪ繝｢繝ｼ繝・state 繧剃ｽｿ縺・悽逡ｪ讒区・縺ｧ縺ｯ self-hosted runner 繧ゅ＠縺上・
#   Azure Private Networking 蟇ｾ蠢懊・ larger runner 縺悟ｿ・ｦ√↓縺ｪ繧九・
###############################################################################
name: verify-oidc

# 讀懆ｨｼ逕ｨ縺ｮ縺溘ａ謇句虚螳溯｡後・縺ｿ縺ｨ縺吶ｋ縲・
# pull_request 縺ｧ襍ｷ蜍輔☆繧九→ ci.yml 縺ｨ莠碁㍾縺ｫ plan 縺瑚ｵｰ繧翫・
# 縺ｩ縺｡繧峨・邨先棡繧定ｦ九ｌ縺ｰ繧医＞縺句・縺九ｉ縺ｪ縺上↑繧九・
on:
  workflow_dispatch:
    inputs:
      run_apply:
        description: "apply 縺ｨ destroy 縺ｾ縺ｧ螳溯｡後☆繧具ｼ域里螳壹・ plan 縺ｾ縺ｧ・・
        type: boolean
        default: false

# OIDC 繝医・繧ｯ繝ｳ縺ｮ逋ｺ陦後↓蠢・医ゅ％繧後′辟｡縺・→ id-token 縺悟叙蠕励〒縺阪↑縺・・
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: ${{ matrix.env }} / ${{ matrix.stack }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}-${{ matrix.stack }}-plan

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: stg
            stack: platform
          - env: prod
            stack: platform

    defaults:
      run:
        working-directory: stacks/${{ matrix.stack }}

    env:
      # azurerm provider 繧・OIDC 縺ｧ蜍輔°縺吶◆繧√・險ｭ螳壹・
      # 繧ｯ繝ｩ繧､繧｢繝ｳ繝医す繝ｼ繧ｯ繝ｬ繝・ヨ繧りｨｼ譏取嶌繧よ欠螳壹＠縺ｦ縺・↑縺・せ縺ｫ豕ｨ逶ｮ縲・
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: 繧ｷ繝ｼ繧ｯ繝ｬ繝・ヨ縺瑚ｨｭ螳壹＆繧後※縺・↑縺・％縺ｨ繧堤｢ｺ隱・
        run: |
          echo "縺薙・ job 縺悟盾辣ｧ縺励※縺・ｋ隱崎ｨｼ諠・ｱ縺ｯ Environment variables 縺ｮ縺ｿ縺ｧ縺吶・
          echo "ARM_CLIENT_ID       = ${ARM_CLIENT_ID}"
          echo "ARM_TENANT_ID       = ${ARM_TENANT_ID}"
          echo "ARM_SUBSCRIPTION_ID = ${ARM_SUBSCRIPTION_ID}"
          echo "ARM_CLIENT_SECRET   = '${ARM_CLIENT_SECRET:-(譛ｪ險ｭ螳・}'"
          if [ -n "${ARM_CLIENT_SECRET:-}" ]; then
            echo "::error::ARM_CLIENT_SECRET 縺瑚ｨｭ螳壹＆繧後※縺・∪縺吶０IDC 讀懆ｨｼ縺ｮ蜑肴署縺悟ｴｩ繧後∪縺吶・
            exit 1
          fi

      - name: Azure 縺ｸ OIDC 縺ｧ繝ｭ繧ｰ繧､繝ｳ
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: 繝ｭ繧ｰ繧､繝ｳ縺ｧ縺阪◆縺薙→繧堤｢ｺ隱・
        run: |
          az account show -o json
          echo "---"
          echo "縺薙・ runner 縺御ｽｿ逕ｨ縺励※縺・ｋ縺ｮ縺ｯ GitHub 縺檎匱陦後＠縺溽洒蜻ｽ縺ｮ OIDC 繝医・繧ｯ繝ｳ縺ｧ縺吶・
          echo "runner image: ${ImageOS:-unknown} / hosted"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # backend 繧剃ｽｿ繧上★繝ｭ繝ｼ繧ｫ繝ｫ state 縺ｧ蛻晄悄蛹悶☆繧九・
      #
      # versions.tf 縺ｮ backend "azurerm" 縺ｯ縲∵悽繝・リ繝ｳ繝医・繝昴Μ繧ｷ繝ｼ縺ｫ繧医ｊ
      # GitHub-hosted runner 縺九ｉ縺ｯ蛻ｰ驕斐〒縺阪↑縺・・
      # Terraform 縺ｯ *_override.tf 繧貞ｾ悟享縺｡縺ｧ繝槭・繧ｸ縺吶ｋ縺溘ａ縲・
      # 縺薙％縺ｧ繝ｭ繝ｼ繧ｫ繝ｫ繝舌ャ繧ｯ繧ｨ繝ｳ繝峨↓蟾ｮ縺玲崛縺医ｋ縲・
      #
      # 譛ｬ逡ｪ讒区・・・elf-hosted / private larger runner・峨〒縺ｯ
      # 縺薙・ override 繧剃ｽ懊ｉ縺壹∽ｻ｣繧上ｊ縺ｫ
      #   terraform init -reconfigure -input=false \
      #     -backend-config=envs/<env>/backend.hcl
      # 繧貞ｮ溯｡後☆繧九・
      - name: 繝ｭ繝ｼ繧ｫ繝ｫ繝舌ャ繧ｯ繧ｨ繝ｳ繝峨∈蟾ｮ縺玲崛縺・
        run: |
          cat > local_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF

      - name: terraform init
        run: terraform init -reconfigure -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          terraform plan -input=false \
            -var-file=envs/${{ matrix.env }}/terraform.tfvars \
            -out=tfplan

      - name: terraform apply
        id: apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apply }}
        run: terraform apply -input=false -auto-approve tfplan

      # apply 繧貞ｮ滄圀縺ｫ陦後▲縺溷ｴ蜷医・縺ｿ蠕檎援莉倥￠縺吶ｋ縲・
      #
      # always() 縺縺代〒蛻､螳壹☆繧九→縲√Ο繧ｰ繧､繝ｳ繧・plan 縺悟､ｱ謨励＠縺ｦ
      # apply 縺後せ繧ｭ繝・・縺輔ｌ縺溷ｴ蜷医↓繧・destroy 縺瑚ｵｰ繧翫・
      # 遨ｺ縺ｾ縺溘・荳榊ｮ悟・縺ｪ state 縺ｫ蟇ｾ縺励※ destroy 繧貞ｮ溯｡後＠縺ｦ縺励∪縺・・
      # apply 繧ｹ繝・ャ繝励′ skipped 縺ｧ縺ｪ縺・％縺ｨ繧呈擅莉ｶ縺ｫ蜉縺医※縺昴ｌ繧帝亟縺舌・
      - name: terraform destroy (蠕檎援莉倥￠)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_apply && steps.apply.conclusion != 'skipped' }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var-file=envs/${{ matrix.env }}/terraform.tfvars
