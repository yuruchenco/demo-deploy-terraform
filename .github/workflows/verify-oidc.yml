###############################################################################
# OIDC / GitHub-hosted runner 検証ワークフロー
#
# 検証目皁E
#   1. OIDC (Workload Identity Federation) により、E
#      GitHub 側にシークレチE��を一刁E��存せずに Azure へ認証できること
#   2. GitHub-hosted runner (ubuntu-latest) から、E
#      検証(stg) と 本番(prd) の両環墁E��対して実行できること
#
# 重要な設計�EインチE
#   - 認証惁E��は Environment *variables* のみ�E�Eecrets は未使用�E�、E
#     client ID / tenant ID / subscription ID はぁE��れも機寁E��はなぁE��E
#     パスワードや証明書に相当するものは存在しなぁE��E
#   - `environment:` は job 単位でしか持E��できなぁE��め、E
#     1 環墁E= 1 job とする。これにより環墁E��との承認ゲートが機�Eする、E
#   - OIDC の subject は
#       repo:<OWNER>/<REPO>:environment:<ENVIRONMENT NAME>
#     となる、Entra 側のフェチE��ーション賁E��惁E��をこの subject で
#     登録することで、「その Environment を経由した実行だけが
#     そ�Eサブスクリプションに触れる」ことめEEntra 側で強制できる、E
#
# 既知の制紁E
#   本チE��ントではポリシーによりストレージアカウント�E
#   publicNetworkAccess が強制皁E�� Disabled にされるため、E
#   azurerm backend (リモーチEstate) へは GitHub-hosted runner から
#   到達できなぁE��そのため本ワークフローでは backend を使わず、E
#   ジョブ�Eで完結するローカル state で検証する、E
#   リモーチEstate を使ぁE��番構�Eでは self-hosted runner もしく�E
#   Azure Private Networking 対応�E larger runner が忁E��になる、E
###############################################################################
name: verify-oidc

# 検証用のため手動実行�Eみとする、E
# pull_request で起動すると ci.yml と二重に plan が走り、E
# どちら�E結果を見ればよいか�Eからなくなる、E
on:
  workflow_dispatch:
    inputs:
      run_apply:
        description: "apply と destroy まで実行する（既定�E plan まで�E�E
        type: boolean
        default: false

# OIDC ト�Eクンの発行に忁E��。これが無ぁE�� id-token が取得できなぁE��E
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: ${{ matrix.env }} / ${{ matrix.stack }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}-${{ matrix.stack }}-plan

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: stg
            stack: platform
          - env: prd
            stack: platform

    defaults:
      run:
        working-directory: stacks/${{ matrix.stack }}

    env:
      # azurerm provider めEOIDC で動かすため�E設定、E
      # クライアントシークレチE��も証明書も指定してぁE��ぁE��に注目、E
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: シークレチE��が設定されてぁE��ぁE��とを確誁E
        run: |
          echo "こ�E job が参照してぁE��認証惁E��は Environment variables のみです、E
          echo "ARM_CLIENT_ID       = ${ARM_CLIENT_ID}"
          echo "ARM_TENANT_ID       = ${ARM_TENANT_ID}"
          echo "ARM_SUBSCRIPTION_ID = ${ARM_SUBSCRIPTION_ID}"
          echo "ARM_CLIENT_SECRET   = '${ARM_CLIENT_SECRET:-(未設宁E}'"
          if [ -n "${ARM_CLIENT_SECRET:-}" ]; then
            echo "::error::ARM_CLIENT_SECRET が設定されてぁE��す。OIDC 検証の前提が崩れます、E
            exit 1
          fi

      - name: Azure へ OIDC でログイン
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: ログインできたことを確誁E
        run: |
          az account show -o json
          echo "---"
          echo "こ�E runner が使用してぁE��のは GitHub が発行した短命の OIDC ト�Eクンです、E
          echo "runner image: ${ImageOS:-unknown} / hosted"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # backend を使わずローカル state で初期化する、E
      #
      # versions.tf の backend "azurerm" は、本チE��ント�Eポリシーにより
      # GitHub-hosted runner からは到達できなぁE��E
      # Terraform は *_override.tf を後勝ちでマ�Eジするため、E
      # ここでローカルバックエンドに差し替える、E
      #
      # 本番構�E�E�Eelf-hosted / private larger runner�E�では
      # こ�E override を作らず、代わりに
      #   terraform init -reconfigure -input=false \
      #     -backend-config=envs/<env>/backend.hcl
      # を実行する、E
      - name: ローカルバックエンドへ差し替ぁE
        run: |
          cat > local_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF

      - name: terraform init
        run: terraform init -reconfigure -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          terraform plan -input=false \
            -var-file=envs/${{ matrix.env }}/terraform.tfvars \
            -out=tfplan

      - name: terraform apply
        id: apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apply }}
        run: terraform apply -input=false -auto-approve tfplan

      # apply を実際に行った場合�Eみ後片付けする、E
      #
      # always() だけで判定すると、ログインめEplan が失敗して
      # apply がスキチE�Eされた場合にめEdestroy が走り、E
      # 空また�E不完�Eな state に対して destroy を実行してしまぁE��E
      # apply スチE��プが skipped でなぁE��とを条件に加えてそれを防ぐ、E
      - name: terraform destroy (後片付け)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_apply && steps.apply.conclusion != 'skipped' }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var-file=envs/${{ matrix.env }}/terraform.tfvars
